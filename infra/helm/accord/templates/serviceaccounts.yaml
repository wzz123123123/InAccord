{{- $root := . -}}
{{- range $name := (include "accord.componentNames" . | fromJsonArray) }}
{{- $component := index $root.Values.components $name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $component.service_account | quote }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "accord.componentLabels" (dict "root" $root "name" $name "component" $component) | nindent 4 }}
  annotations:
    {{- include "accord.contractAnnotations" $root | nindent 4 }}
    accord.inforvans.com/workload-identity-provider: {{ $component.identity.provider_name | quote }}
    accord.inforvans.com/workload-identity-subject: {{ $component.identity.subject | quote }}
    accord.inforvans.com/workload-identity-audience: {{ $component.identity.audience | quote }}
    {{- if eq $component.identity.provider "AWS" }}
    eks.amazonaws.com/role-arn: {{ $component.identity.role_arn | quote }}
    {{- else if eq $component.identity.provider "GCP" }}
    iam.gke.io/gcp-service-account: {{ $component.identity.service_account_email | quote }}
    {{- else if eq $component.identity.provider "AZURE" }}
    azure.workload.identity/client-id: {{ $component.identity.client_id | quote }}
    azure.workload.identity/tenant-id: {{ $component.identity.tenant_id | quote }}
    {{- else if ne $component.identity.provider "KUBERNETES" }}
    {{- fail (printf "unsupported closed identity provider %s" $component.identity.provider) }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}

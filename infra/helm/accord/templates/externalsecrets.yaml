{{- $root := . -}}
{{- range $name := (include "accord.componentNames" . | fromJsonArray) }}
{{- $component := index $root.Values.components $name }}
{{- $external := $component.external_secret }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $external.target_name | quote }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "accord.componentLabels" (dict "root" $root "name" $name "component" $component) | nindent 4 }}
  annotations:
    {{- include "accord.contractAnnotations" $root | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: {{ $external.store.kind | quote }}
    name: {{ $external.store.name | quote }}
  target:
    name: {{ $external.target_name | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          accord.inforvans.com/component: {{ $name | quote }}
  data:
    - secretKey: {{ $external.target_keys.database_password | quote }}
      remoteRef:
        key: {{ $external.remote_ref | quote }}
        property: database-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: {{ $external.target_keys.postgres_ca | quote }}
      remoteRef:
        key: {{ $external.remote_ref | quote }}
        property: postgres-ca
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: {{ $external.target_keys.otlp_ca | quote }}
      remoteRef:
        key: {{ $external.remote_ref | quote }}
        property: otlp-ca
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- if eq $name "webhook-edge" }}
    - secretKey: {{ $external.target_keys.webhook_bindings | quote }}
      remoteRef:
        key: {{ $external.remote_ref | quote }}
        property: webhook-bindings
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
    {{- if eq $name "control-worker" }}
    - secretKey: {{ $external.target_keys.temporal_ca | quote }}
      remoteRef:
        key: {{ $external.remote_ref | quote }}
        property: temporal-ca
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: {{ $external.target_keys.temporal_client_certificate | quote }}
      remoteRef:
        key: {{ $external.temporal_client_certificate_ref.remote_ref | quote }}
        property: {{ $external.temporal_client_certificate_ref.certificate_property | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: {{ $external.target_keys.temporal_client_private_key | quote }}
      remoteRef:
        key: {{ $external.temporal_client_certificate_ref.remote_ref | quote }}
        property: {{ $external.temporal_client_certificate_ref.private_key_property | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}

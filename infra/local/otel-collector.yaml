extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  transform/allowlist:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name", "telemetry.sdk.name", "telemetry.sdk.language", "telemetry.sdk.version"])
      - context: span
        statements:
          - keep_keys(attributes, ["accord.tenant.id", "accord.scope.type", "accord.scope.id", "accord.correlation.id", "accord.causation.id", "accord.operation", "accord.provider", "accord.result_code", "accord.aggregate.type", "accord.event.type", "http.request.method", "http.route", "http.response.status_code"])
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name", "telemetry.sdk.name", "telemetry.sdk.language", "telemetry.sdk.version"])
      - context: datapoint
        statements:
          - keep_keys(attributes, ["accord.operation", "accord.provider", "accord.result_code", "accord.telemetry.signal", "accord.telemetry.reason"])
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name", "telemetry.sdk.name", "telemetry.sdk.language", "telemetry.sdk.version"])
      - context: log
        statements:
          - keep_keys(attributes, ["accord.operation", "accord.provider", "accord.result_code", "accord.aggregate.type", "accord.event.type"])
  batch:
    send_batch_size: 256
    send_batch_max_size: 512
    timeout: 2s

exporters:
  file:
    path: /var/lib/otel/accord-telemetry.jsonl
    format: json
    rotation:
      max_megabytes: 16
      max_days: 3
      max_backups: 5
    flush_interval: 1s
  prometheus:
    endpoint: 0.0.0.0:9464
    enable_open_metrics: true

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/allowlist, batch]
      exporters: [file]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/allowlist, batch]
      exporters: [file, prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/allowlist, batch]
      exporters: [file]

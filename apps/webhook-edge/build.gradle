abstract class VerifyProviderWebhookSignalSchema extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getSchemaFile()

    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getGoldenFile()

    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getPackageFile()

    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getPnpmLockFile()

    @Input
    abstract Property<String> getCorepackExecutable()

    @Internal
    abstract DirectoryProperty getRepositoryDirectory()

    @LocalState
    abstract DirectoryProperty getNegativeDirectory()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void verifySchema() {
        File golden = goldenFile.get().asFile
        def positive = runAjv(golden)
        if (positive[0] != 0) {
            throw new GradleException('Golden provider webhook signal failed AJV validation')
        }

        File negativeRoot = negativeDirectory.get().asFile
        if (!negativeRoot.isDirectory() && !negativeRoot.mkdirs()) {
            throw new GradleException('Cannot create provider webhook signal verification directory')
        }
        def goldenDocument = (Map) new groovy.json.JsonSlurper().parse(golden)
        def forbiddenValues = [
            url: 'https://forbidden.invalid/private',
            commits: [[message: 'forbidden']],
            message: 'forbidden',
            token: 'forbidden',
            headers: [authorization: 'forbidden'],
            raw_body: 'forbidden'
        ]
        for (def entry : forbiddenValues.entrySet()) {
            String field = entry.key
            Object value = entry.value
            def negativeDocument = new LinkedHashMap(goldenDocument)
            negativeDocument[field] = value
            File negative = new File(negativeRoot, "${field}.json")
            negative.setText(
                    groovy.json.JsonOutput.prettyPrint(
                            groovy.json.JsonOutput.toJson(negativeDocument)) + '\n',
                    'UTF-8')
            def result = runAjv(negative)
            if (result[0] == 0 || !result[1].contains('additionalProperties')) {
                throw new GradleException(
                        "AJV did not reject forbidden provider webhook signal field: ${field}")
            }
        }
    }

    private List<Object> runAjv(File data) {
        def output = new ByteArrayOutputStream()
        def result = execOperations.exec { spec ->
            spec.workingDir(repositoryDirectory.get().asFile)
            spec.commandLine([
                corepackExecutable.get(),
                'pnpm',
                'exec',
                'ajv',
                'validate',
                '--spec=draft2020',
                '-c',
                'ajv-formats',
                '-s',
                schemaFile.get().asFile.absolutePath,
                '-d',
                data.absolutePath
            ])
            spec.ignoreExitValue = true
            spec.standardOutput = output
            spec.errorOutput = output
        }
        [result.exitValue, output.toString('UTF-8')]
    }
}

final class WebhookEdgeArchiveLimits {
    final long maxOuterBytes
    final int maxOuterEntries
    final int maxArchives
    final long maxLibraryBytes
    final long maxTotalLibraryBytes
    final int maxArchiveEntries
    final int maxTotalEntries
    final int maxEntryNameBytes
    final long maxExpandedEntryBytes
    final long maxExpandedArchiveBytes
    final long maxTotalExpandedBytes
    final int maxDepth
    final int maxViolations
    final long maxElapsedNanos

    WebhookEdgeArchiveLimits(
            long maxOuterBytes,
            int maxOuterEntries,
            int maxArchives,
            long maxLibraryBytes,
            long maxTotalLibraryBytes,
            int maxArchiveEntries,
            int maxTotalEntries,
            int maxEntryNameBytes,
            long maxExpandedEntryBytes,
            long maxExpandedArchiveBytes,
            long maxTotalExpandedBytes,
            int maxDepth,
            int maxViolations,
            long maxElapsedNanos) {
        this.maxOuterBytes = maxOuterBytes
        this.maxOuterEntries = maxOuterEntries
        this.maxArchives = maxArchives
        this.maxLibraryBytes = maxLibraryBytes
        this.maxTotalLibraryBytes = maxTotalLibraryBytes
        this.maxArchiveEntries = maxArchiveEntries
        this.maxTotalEntries = maxTotalEntries
        this.maxEntryNameBytes = maxEntryNameBytes
        this.maxExpandedEntryBytes = maxExpandedEntryBytes
        this.maxExpandedArchiveBytes = maxExpandedArchiveBytes
        this.maxTotalExpandedBytes = maxTotalExpandedBytes
        this.maxDepth = maxDepth
        this.maxViolations = maxViolations
        this.maxElapsedNanos = maxElapsedNanos
    }

    static WebhookEdgeArchiveLimits production() {
        new WebhookEdgeArchiveLimits(
                64L * 1_024 * 1_024,
                1_024,
                128,
                8L * 1_024 * 1_024,
                64L * 1_024 * 1_024,
                4_096,
                32_768,
                512,
                4L * 1_024 * 1_024,
                32L * 1_024 * 1_024,
                128L * 1_024 * 1_024,
                2,
                1,
                Duration.ofSeconds(30).toNanos())
    }
}

final class WebhookEdgeExpectedEntry {
    final long bytes
    final String sha256

    WebhookEdgeExpectedEntry(long bytes, String sha256) {
        if (bytes < 0 || sha256 == null || !(sha256 ==~ /[0-9a-f]{64}/)) {
            throw new IllegalArgumentException('invalid expected archive entry metadata')
        }
        this.bytes = bytes
        this.sha256 = sha256
    }
}

final class WebhookEdgeArtifactVerifier {
    private static final LongSupplier SYSTEM_NANO_TIME = { System.nanoTime() } as LongSupplier
    private static final String APPLICATION_CLASSES_ROOT = 'BOOT-INF/classes/'
    private static final String APPLICATION_PACKAGE_ROOT =
            'BOOT-INF/classes/com/inforvans/accord/webhookedge/'
    private static final String APPLICATION_CONFIGURATION = 'BOOT-INF/classes/application.yml'
    private static final String EXPECTED_START_CLASS =
            'com.inforvans.accord.webhookedge.WebhookEdgeApplication'
    private static final String EXPECTED_MAIN_CLASS =
            'org.springframework.boot.loader.launch.JarLauncher'
    private static final String TRUSTED_OBSERVABILITY_PROJECT = ':libs:java:observability'
    private static final String ACCORD_PACKAGE_ROOT = 'com/inforvans/accord/'
    private static final String OBSERVABILITY_PACKAGE_ROOT =
            'com/inforvans/accord/observability/'
    private static final List<String> FORBIDDEN_MANIFEST_ATTRIBUTES = [
        'Class-Path',
        'Premain-Class',
        'Agent-Class',
        'Launcher-Agent-Class'
    ]
    private static final List<String> FORBIDDEN_OUTER_PACKAGE_PATHS = [
        'com/inforvans/accord/controlplane/',
        'com/inforvans/accord/reliability/',
        'com/inforvans/accord/database/',
        'org/eclipse/jgit/',
        'org/gitlab4j/',
        'org/kohsuke/github/'
    ]
    private static final List<String> FORBIDDEN_NESTED_PACKAGE_PATHS = [
        'com/inforvans/accord/controlplane/',
        'com/inforvans/accord/reliability/',
        'com/inforvans/accord/database/',
        'org/eclipse/jgit/',
        'org/gitlab4j/',
        'org/kohsuke/github/'
    ]
    private static final List<String> FORBIDDEN_OUTER_FRAGMENTS = [
        'control-plane',
        'platform-kernel',
        'reliability-',
        'jgit-',
        'gitlab4j-',
        'github-api-',
        'raw-body',
        'raw_body'
    ]
    private static final List<String> REQUIRED_ENTRIES = [
        APPLICATION_CONFIGURATION,
        'BOOT-INF/classes/com/inforvans/accord/webhookedge/WebhookEdgeApplication.class',
        'BOOT-INF/classes/com/inforvans/accord/webhookedge/webhook/WebhookHandler.class'
    ]


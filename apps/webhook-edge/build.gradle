            'archive-entry-budget': limits(production, [maxArchiveEntries: 0]),
            'total-entry-budget': limits(production, [maxTotalEntries: 0]),
            'expanded-entry-budget': limits(production, [maxExpandedEntryBytes: 0]),
            'expanded-archive-budget': limits(production, [maxExpandedArchiveBytes: 0]),
            'total-expanded-budget': limits(production, [maxTotalExpandedBytes: 0])
        ]
        Map<String, String> budgetMessages = [
            'outer-byte-budget': 'outer archive byte budget',
            'outer-entry-budget': 'outer entry budget',
            'archive-count-budget': 'archive count budget',
            'library-byte-budget': 'archive byte budget',
            'total-library-byte-budget': 'aggregate nested archive byte budget',
            'archive-entry-budget': 'per-archive entry budget',
            'total-entry-budget': 'aggregate entry budget',
            'expanded-entry-budget': 'expanded entry byte budget',
            'expanded-archive-budget': 'per-archive expanded byte budget',
            'total-expanded-budget': 'aggregate expanded byte budget'
        ]
        for (Map.Entry<String, WebhookEdgeArchiveLimits> reducedLimit : reducedLimits.entrySet()) {
            String name = reducedLimit.key
            WebhookEdgeArchiveLimits reduced = reducedLimit.value
            expectRejected(
                    results,
                    name,
                    positive,
                    applicationEntries,
                    loaderEntries,
                    reduced,
                    budgetMessages[name],
                    root)
        }

        Map<String, byte[]> failFastEntries = new LinkedHashMap<>()
        failFastEntries['BOOT-INF/classes/first-forbidden.txt'] = new byte[] {1}
        failFastEntries['BOOT-INF/classes/second-forbidden.txt'] = new byte[] {1}
        failFastEntries.putAll(canonical)
        expectFirstViolationOnly(
                results,
                'violation-budget',
                writeZip(root.resolve('violation-budget.jar'), failFastEntries),
                applicationEntries,
                loaderEntries,
                production,
                'first-forbidden.txt',
                'second-forbidden.txt',
                root)

        expectRejected(
                results,
                'elapsed-budget',
                positive,
                applicationEntries,
                loaderEntries,
                production,
                'elapsed time budget exceeded',
                root,
                new DeterministicNanoTime(2))

        Path declaredDirectory = root.resolve('declared-directory')
        Files.createDirectories(declaredDirectory)
        expectRuntimeRejected(
                results,
                'declared-directory',
                runtimeBaseline,
                [declaredDirectory.toFile()] as Set<File>,
                'declared file dependencies')
        expectRuntimeRejected(
                results,
                'project-artifact',
                runtimeBaseline + [
                    'REJECTED|org.gradle.api.artifacts.component.ProjectComponentIdentifier|edge.jar|regular=true'
                ],
                [] as Set<File>,
                'non-module runtime artifacts')

        results.verifyComplete()
    }

    private static Map<String, byte[]> canonicalEntries(
            Map<String, byte[]> applicationContents,
            Map<String, byte[]> loaderContents,
            byte[] safeLibrary) {
        Map<String, byte[]> entries = new LinkedHashMap<>()
        entries['META-INF/MANIFEST.MF'] = manifestBytes([:])
        applicationContents.toSorted().each { name, contents -> entries[name] = contents }
        loaderContents.toSorted().each { name, contents -> entries[name] = contents }
        entries['BOOT-INF/lib/safe'] = safeLibrary
        entries
    }

    private static Map<String, byte[]> copyEntries(Map<String, byte[]> source) {
        new LinkedHashMap<String, byte[]>(source)
    }

    private static byte[] mutateFirstByte(byte[] source) {
        if (source.length == 0) {
            throw new GradleException('Cannot mutate an empty synthetic archive entry')
        }
        byte[] mutated = source.clone()
        mutated[0] = (byte) (mutated[0] ^ 0x01)
        mutated
    }

    private static byte[] manifestBytes(Map<String, String> mutations) {
        Map<String, String> attributes = new LinkedHashMap<>()
        attributes['Manifest-Version'] = '1.0'
        attributes['Main-Class'] = 'org.springframework.boot.loader.launch.JarLauncher'
        attributes['Start-Class'] = 'com.inforvans.accord.webhookedge.WebhookEdgeApplication'
        attributes.putAll(mutations)
        StringBuilder content = new StringBuilder()
        attributes.each { name, value -> content.append(name).append(': ').append(value).append('\r\n') }
        content.append('\r\n').toString().getBytes(StandardCharsets.UTF_8)
    }

    private static Path writeZip(Path artifact, Map<String, byte[]> entries) {
        ZipOutputStream zip = new ZipOutputStream(Files.newOutputStream(artifact))
        try {
            entries.each { name, contents ->
                zip.putNextEntry(new ZipEntry(name))
                zip.write(contents)
                zip.closeEntry()
            }
        } finally {
            zip.close()
        }
        artifact
    }

    private static byte[] zipBytes(Map<String, byte[]> entries) {
        ByteArrayOutputStream bytes = new ByteArrayOutputStream()
        ZipOutputStream zip = new ZipOutputStream(bytes)
        try {
            entries.each { name, contents ->
                zip.putNextEntry(new ZipEntry(name))
                zip.write(contents)
                zip.closeEntry()
            }
        } finally {
            zip.close()
        }
        bytes.toByteArray()
    }

    private static void writeZipWithDuplicate(
            Path artifact, Map<String, byte[]> entries, String duplicate) {
        String placeholder = 'z' * duplicate.length()
        Map<String, byte[]> withPlaceholder = copyEntries(entries)
        withPlaceholder[placeholder] = entries[duplicate]
        writeZip(artifact, withPlaceholder)
        byte[] bytes = Files.readAllBytes(artifact)
        replaceAll(bytes, placeholder.getBytes(StandardCharsets.US_ASCII),
                duplicate.getBytes(StandardCharsets.US_ASCII))
        Files.write(artifact, bytes)
    }

    private static void replaceAll(byte[] bytes, byte[] target, byte[] replacement) {
        if (target.length != replacement.length) {
            throw new IllegalArgumentException('ZIP name replacement must preserve length')
        }
        int replacements = 0
        for (int offset = 0; offset <= bytes.length - target.length; offset++) {
            boolean matches = true
            for (int index = 0; index < target.length; index++) {
                if (bytes[offset + index] != target[index]) {
                    matches = false
                    break
                }
            }
            if (matches) {
                System.arraycopy(replacement, 0, bytes, offset, replacement.length)
                replacements++
                offset += target.length - 1
            }
        }
        if (replacements != 2) {
            throw new GradleException("Expected two ZIP name replacements, found ${replacements}")
        }
    }

    private static byte[] corruptFirstPayload(byte[] source) {
        byte[] corrupted = source.clone()
        int fileNameLength = littleEndian16(corrupted, 26)
        int extraLength = littleEndian16(corrupted, 28)
        int payload = 30 + fileNameLength + extraLength
        if (payload >= corrupted.length) {
            throw new GradleException('Cannot locate synthetic ZIP payload')
        }
        corrupted[payload] = (byte) (corrupted[payload] ^ 0x01)
        corrupted
    }

    private static int littleEndian16(byte[] bytes, int offset) {
        (bytes[offset] & 0xff) | ((bytes[offset + 1] & 0xff) << 8)
    }

    private static WebhookEdgeArchiveLimits limits(
            WebhookEdgeArchiveLimits source, Map<String, Number> overrides) {
        new WebhookEdgeArchiveLimits(
                overrides.getOrDefault('maxOuterBytes', source.maxOuterBytes).longValue(),
                overrides.getOrDefault('maxOuterEntries', source.maxOuterEntries).intValue(),
                overrides.getOrDefault('maxArchives', source.maxArchives).intValue(),
                overrides.getOrDefault('maxLibraryBytes', source.maxLibraryBytes).longValue(),
                overrides.getOrDefault('maxTotalLibraryBytes', source.maxTotalLibraryBytes).longValue(),
                overrides.getOrDefault('maxArchiveEntries', source.maxArchiveEntries).intValue(),
                overrides.getOrDefault('maxTotalEntries', source.maxTotalEntries).intValue(),
                overrides.getOrDefault('maxEntryNameBytes', source.maxEntryNameBytes).intValue(),
                overrides.getOrDefault('maxExpandedEntryBytes', source.maxExpandedEntryBytes).longValue(),
                overrides.getOrDefault('maxExpandedArchiveBytes', source.maxExpandedArchiveBytes).longValue(),
                overrides.getOrDefault('maxTotalExpandedBytes', source.maxTotalExpandedBytes).longValue(),
                overrides.getOrDefault('maxDepth', source.maxDepth).intValue(),
                overrides.getOrDefault('maxViolations', source.maxViolations).intValue(),
                overrides.getOrDefault('maxElapsedNanos', source.maxElapsedNanos).longValue())
    }

    private static void expectRejected(
            FixtureResults results,
            String name,
            Path artifact,
            Map<String, WebhookEdgeExpectedEntry> applicationEntries,
            Map<String, WebhookEdgeExpectedEntry> loaderEntries,
            WebhookEdgeArchiveLimits limits,
            String expectedMessage,
            Path root,
            LongSupplier nanoTime = null) {
        results.beginCase(name)
        try {
            if (nanoTime == null) {
                WebhookEdgeArtifactVerifier.verify(
                        artifact.toFile(),
                        root.resolve("scratch-${name}").toFile(),
                        applicationEntries,
                        loaderEntries,
                        limits)
            } else {
                WebhookEdgeArtifactVerifier.verify(
                        artifact.toFile(),
                        root.resolve("scratch-${name}").toFile(),
                        applicationEntries,
                        loaderEntries,
                        limits,
                        nanoTime)
            }
            results.recordFailure("${name}: accepted")
        } catch (GradleException failure) {
            if (!failure.message.contains(expectedMessage)) {
                results.recordFailure("${name}: wrong violation ${failure.message}")
            }
        } catch (Throwable failure) {
            results.recordFailure("${name}: unnormalized ${failure.class.name}")
        }
    }

    private static void expectFirstViolationOnly(
            FixtureResults results,
            String name,
            Path artifact,
            Map<String, WebhookEdgeExpectedEntry> applicationEntries,
            Map<String, WebhookEdgeExpectedEntry> loaderEntries,
            WebhookEdgeArchiveLimits limits,
            String expectedFirst,
            String forbiddenLater,
            Path root) {
        results.beginCase(name)
        try {
            WebhookEdgeArtifactVerifier.verify(
                    artifact.toFile(),
                    root.resolve("scratch-${name}").toFile(),
                    applicationEntries,
                    loaderEntries,
                    limits)
            results.recordFailure("${name}: accepted")
        } catch (GradleException failure) {
            if (!failure.message.contains(expectedFirst)
                    || failure.message.contains(forbiddenLater)) {
                results.recordFailure("${name}: did not terminate at the first violation")
            }
        } catch (Throwable failure) {
            results.recordFailure("${name}: unnormalized ${failure.class.name}")
        }
    }

    private static void expectRuntimeRejected(
            FixtureResults results,
            String name,
            List<String> runtimeArtifacts,
            Set<File> fileDependencies,
            String expectedMessage) {
        results.beginCase(name)
        try {
            WebhookEdgeArtifactVerifier.verifyRuntimeBoundary(runtimeArtifacts, fileDependencies)
            results.recordFailure("${name}: accepted")
        } catch (GradleException failure) {
            if (!failure.message.contains(expectedMessage)) {
                results.recordFailure("${name}: wrong violation ${failure.message}")
            }
        } catch (Throwable failure) {
            results.recordFailure("${name}: unnormalized ${failure.class.name}")
        }
    }

    private static final class DeterministicNanoTime implements LongSupplier {
        private int callsWithinBudget

        private DeterministicNanoTime(int callsWithinBudget) {
            this.callsWithinBudget = callsWithinBudget
        }

        @Override
        long getAsLong() {
            if (callsWithinBudget-- > 0) {
                return 0L
            }
            Duration.ofSeconds(31).toNanos()
        }
    }

    private static final class FixtureResults {
        private final int expectedCases
        private final List<String> failures = []
        private int cases

        private FixtureResults(int expectedCases) {
            this.expectedCases = expectedCases
        }

        private void beginCase(String name) {
            if (cases >= expectedCases) {
                throw new GradleException(
                        "Webhook edge hostile fixture case budget exceeded at ${name}")
            }
            cases++
        }

        private void recordFailure(String failure) {
            if (failures.size() >= expectedCases) {
                throw new GradleException(
                        'Webhook edge hostile fixture violation budget exceeded')
            }
            failures.add(failure)
        }

        private void verifyComplete() {
            if (cases != expectedCases) {
                throw new GradleException(
                        "Webhook edge hostile fixture count was ${cases}, expected ${expectedCases}")
            }
            if (!failures.isEmpty()) {
                throw new GradleException(
                        "Webhook edge boundary negative fixtures failed: ${failures}")
            }
        }
    }
}

abstract class WebhookEdgeTestArguments implements CommandLineArgumentProvider {
    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getArtifact()

    @Input
    abstract ListProperty<String> getRuntimeArtifacts()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getApplicationOutputDirectories()

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getLoaderToolsJar()

    @Override
    Iterable<String> asArguments() {
        List<String> arguments = [
            "-Daccord.webhook-edge.boot-jar=${artifact.get().asFile.absolutePath}",
            "-Daccord.webhook-edge.runtime-coordinates=${runtimeArtifacts.get().join('\n')}",
            "-Daccord.webhook-edge.loader-tools-jar=${loaderToolsJar.get().asFile.absolutePath}"
        ]
        List<File> outputs = applicationOutputDirectories.files.toList().sort { left, right ->
            left.absolutePath <=> right.absolutePath
        }
        arguments.add("-Daccord.webhook-edge.application-output-count=${outputs.size()}")
        outputs.eachWithIndex { output, index ->
            arguments.add(
                    "-Daccord.webhook-edge.application-output-${index}=${output.absolutePath}")
        }
        arguments
    }
}


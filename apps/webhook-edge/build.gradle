def runtimeArtifactsProvider = configurations.runtimeClasspath.incoming.artifacts.resolvedArtifacts.map {
        artifacts ->
    artifacts.collect { artifact ->
        def component = artifact.id.componentIdentifier
        if (component instanceof ModuleComponentIdentifier && artifact.file.isFile()) {
            return "${component.group}:${component.module}:${component.version}"
        }
        if (component instanceof ProjectComponentIdentifier
                && component.projectPath == ':libs:java:observability'
                && artifact.file.isFile()) {
            String digest = HexFormat.of().formatHex(
                    MessageDigest.getInstance('SHA-256').digest(
                            Files.readAllBytes(artifact.file.toPath())))
            return "PROJECT|${component.projectPath}|${artifact.file.name}|" +
                    "${artifact.file.length()}|${digest}"
        }
        "REJECTED|${component.class.name}|${artifact.file.name}|regular=${artifact.file.isFile()}"
    }.toSet().toList().sort()
}
def loaderToolsJarProvider = layout.file(providers.provider {
    def location = org.springframework.boot.loader.tools.LoaderImplementation
            .protectionDomain?.codeSource?.location
    if (location == null || location.protocol != 'file') {
        throw new GradleException('Spring Boot loader tools CodeSource is not a local file')
    }
    File loaderToolsJar = new File(location.toURI()).canonicalFile
    if (!loaderToolsJar.isFile()
            || loaderToolsJar.name != 'spring-boot-loader-tools-3.5.3.jar') {
        throw new GradleException(
                'Spring Boot LoaderImplementation did not resolve to the fixed loader-tools JAR')
    }
    loaderToolsJar
})


    static void verify(
            File artifact,
            File scratchDirectory,
            Map<String, WebhookEdgeExpectedEntry> expectedApplicationEntries,
            Map<String, WebhookEdgeExpectedEntry> expectedLoaderEntries,
            Map<String, WebhookEdgeExpectedEntry> trustedObservabilityLibraries,
            WebhookEdgeArchiveLimits limits,
            LongSupplier nanoTime) {
        ScanState state = new ScanState(scratchDirectory.toPath(), limits, nanoTime)
        state.checkElapsed()
        if (!artifact.isFile()) {
            state.failBoundary('artifact is not a regular file')
        }
        if (artifact.length() > limits.maxOuterBytes) {
            state.failBoundary("outer archive byte budget exceeded: ${artifact.length()}")
        }
        Files.createDirectories(scratchDirectory.toPath())

        Set<String> entries = new LinkedHashSet<>()
        Set<String> applicationEntries = new LinkedHashSet<>()
        Set<String> loaderEntries = new LinkedHashSet<>()
        Set<String> trustedLibraries = new LinkedHashSet<>()
        state.checkElapsed()
        ZipFile jar
        try {
            jar = new ZipFile(artifact)
        } catch (IOException exception) {
            state.failBoundary('outer artifact is not a valid ZIP archive')
            return
        }
        try {
            def jarEntries = jar.entries()
            while (jarEntries.hasMoreElements()) {
                state.checkElapsed()
                def entry = jarEntries.nextElement()
                String name = entry.name
                validateEntryName(name, 'outer archive', state, limits)
                if (!entries.add(name)) {
                    state.failBoundary("duplicate entry: ${name}")
                }
                state.outerEntries++
                if (state.outerEntries > limits.maxOuterEntries) {
                    state.failBoundary("outer entry budget exceeded at ${name}")
                }
                if (entry.directory) {
                    continue
                }
                if (containsAny(name, FORBIDDEN_OUTER_FRAGMENTS)
                        || containsAny(name, FORBIDDEN_OUTER_PACKAGE_PATHS)) {
                    state.failBoundary("forbidden outer entry: ${name}")
                }
                if (name.startsWith(APPLICATION_CLASSES_ROOT)) {
                    if (name.endsWith('.class')) {
                        if (!name.startsWith(APPLICATION_PACKAGE_ROOT)) {
                            state.failBoundary("unexpected application class: ${name}")
                        }
                    } else if (name != APPLICATION_CONFIGURATION) {
                        state.failBoundary("unexpected application entry: ${name}")
                    }
                    verifyExpectedOuterEntry(
                            jar,
                            entry,
                            expectedApplicationEntries,
                            'application output',
                            state)
                    applicationEntries.add(name)
                }
                if (isEmittedLoaderEntry(name) && !name.startsWith(APPLICATION_CLASSES_ROOT)) {
                    if (name.endsWith('.class')
                            && (!name.startsWith('org/springframework/boot/loader/')
                            || name.toLowerCase(Locale.ROOT).contains('agent'))) {
                        state.failBoundary("unexpected root class: ${name}")
                    }
                    verifyExpectedOuterEntry(
                            jar,
                            entry,
                            expectedLoaderEntries,
                            'Boot loader',
                            state)
                    loaderEntries.add(name)
                }
                if (name.startsWith('BOOT-INF/lib/')) {
                    copyAndScanLibrary(
                            jar,
                            entry,
                            trustedObservabilityLibraries,
                            trustedLibraries,
                            state,
                            limits)
                }
            }

            def manifestEntry = jar.getEntry('META-INF/MANIFEST.MF')
            if (manifestEntry == null) {
                state.failBoundary('missing META-INF/MANIFEST.MF')
            } else {
                state.checkElapsed()
                InputStream manifestInput = jar.getInputStream(manifestEntry)
                try {
                    Manifest manifest = new Manifest(manifestInput)
                    String mainClass = manifest.mainAttributes.getValue('Main-Class')
                    if (mainClass != EXPECTED_MAIN_CLASS) {
                        state.failBoundary(
                                "Manifest Main-Class must be ${EXPECTED_MAIN_CLASS}, was ${mainClass}")
                    }
                    String startClass = manifest.mainAttributes.getValue('Start-Class')
                    if (startClass != EXPECTED_START_CLASS) {
                        state.failBoundary(
                                "Manifest Start-Class must be ${EXPECTED_START_CLASS}, was ${startClass}")
                    }
                    for (String attribute : FORBIDDEN_MANIFEST_ATTRIBUTES) {
                        if (manifest.mainAttributes.getValue(attribute) != null) {
                            state.failBoundary("Manifest ${attribute} is forbidden")
                        }
                    }
                } finally {
                    manifestInput.close()
                }
            }
        } finally {
            jar.close()
        }

        for (String required : REQUIRED_ENTRIES) {
            state.checkElapsed()
            if (!entries.contains(required)) {
                state.failBoundary("missing required entry: ${required}")
            }
        }
        if (applicationEntries != expectedApplicationEntries.keySet()) {
            state.failBoundary(describeSetDifference(
                    'application outputs', expectedApplicationEntries.keySet(), applicationEntries))
        }
        if (loaderEntries != expectedLoaderEntries.keySet()) {
            state.failBoundary(describeSetDifference(
                    'Boot loader entries', expectedLoaderEntries.keySet(), loaderEntries))
        }
        if (trustedLibraries != trustedObservabilityLibraries.keySet()) {
            state.failBoundary(describeSetDifference(
                    'trusted observability libraries',
                    trustedObservabilityLibraries.keySet(),
                    trustedLibraries))
        }
        state.checkElapsed()
    }

    static Map<String, WebhookEdgeExpectedEntry> expectedApplicationEntries(
            Set<File> outputDirectories) {
        WebhookEdgeArchiveLimits limits = WebhookEdgeArchiveLimits.production()
        long startedAtNanos = System.nanoTime()
        int[] walkedEntries = [0]
        long[] totalBytes = [0L]
        Map<String, WebhookEdgeExpectedEntry> expected = new LinkedHashMap<>()
        for (File directory : outputDirectories.toList().sort { left, right ->
            left.path <=> right.path
        }) {
            if (!directory.exists()) {
                continue
            }
            if (!directory.isDirectory()) {
                failBoundary("application output input is not a directory: ${directory.name}")
            }
            def paths = Files.walk(directory.toPath())
            try {
                paths.forEach { path ->
                    checkExpectedElapsed(startedAtNanos, limits)
                    walkedEntries[0]++
                    if (walkedEntries[0] > limits.maxOuterEntries) {
                        failBoundary('application output entry budget exceeded')
                    }
                    if (Files.isSymbolicLink(path)) {
                        failBoundary('symbolic links are forbidden in application output')
                    }
                    if (!Files.isRegularFile(path, LinkOption.NOFOLLOW_LINKS)) {
                        return
                    }
                    String relative = directory.toPath().relativize(path).toString().replace('\\', '/')
                    String packaged = APPLICATION_CLASSES_ROOT + relative
                    validateApplicationOutputPath(packaged)
                    if (expected.containsKey(packaged)) {
                        failBoundary("duplicate application output: ${packaged}")
                    }
                    WebhookEdgeExpectedEntry entry = expectedEntry(
                            path, limits.maxExpandedEntryBytes, startedAtNanos, limits)
                    totalBytes[0] = checkedExpectedAdd(
                            totalBytes[0],
                            entry.bytes,
                            limits.maxOuterBytes,
                            'application output aggregate byte budget exceeded')
                    expected[packaged] = entry
                }
            } finally {
                paths.close()
            }
        }
        if (expected.isEmpty()) {
            failBoundary('application output is empty')
        }
        expected
    }

    static Map<String, byte[]> loaderReferenceContents(File loaderToolsJar) {
        WebhookEdgeArchiveLimits limits = WebhookEdgeArchiveLimits.production()
        long startedAtNanos = System.nanoTime()
        if (!loaderToolsJar.isFile()
                || loaderToolsJar.name != 'spring-boot-loader-tools-3.5.3.jar') {
            failBoundary('Spring Boot loader tools input is not the fixed regular JAR')
        }
        byte[] loaderArchiveBytes
        ZipFile loaderTools
        try {
            loaderTools = new ZipFile(loaderToolsJar)
        } catch (IOException exception) {
            failBoundary('Spring Boot loader tools input is not a valid ZIP archive')
            return [:]
        }
        try {
            Set<String> names = new LinkedHashSet<>()
            java.util.zip.ZipEntry loaderArchiveEntry = null
            int outerEntries = 0
            def entries = loaderTools.entries()
            while (entries.hasMoreElements()) {
                checkExpectedElapsed(startedAtNanos, limits)
                java.util.zip.ZipEntry entry = entries.nextElement()
                outerEntries++
                if (outerEntries > limits.maxOuterEntries) {
                    failBoundary('Spring Boot loader tools entry budget exceeded')
                }
                if (!names.add(entry.name)) {
                    failBoundary("duplicate Spring Boot loader tools entry: ${entry.name}")
                }
                if (entry.name == 'META-INF/loader/spring-boot-loader.jar') {
                    if (entry.directory || loaderArchiveEntry != null) {
                        failBoundary('Spring Boot loader reference archive must occur exactly once')
                    }
                    loaderArchiveEntry = entry
                }
            }
            if (loaderArchiveEntry == null) {
                failBoundary('Spring Boot loader reference archive is unavailable')
            }
            if (loaderArchiveEntry.size <= 0 || loaderArchiveEntry.size > limits.maxLibraryBytes) {
                failBoundary('Spring Boot loader reference archive byte budget exceeded')
            }
            InputStream loaderArchiveInput = loaderTools.getInputStream(loaderArchiveEntry)
            try {
                loaderArchiveBytes = readBoundedBytes(
                        loaderArchiveInput,
                        limits.maxLibraryBytes,
                        0,
                        limits.maxLibraryBytes,
                        startedAtNanos,
                        limits,
                        loaderArchiveEntry.name)
            } finally {
                loaderArchiveInput.close()
            }
            if (loaderArchiveBytes.length != loaderArchiveEntry.size) {
                failBoundary('Spring Boot loader reference archive byte length mismatch')
            }
        } finally {
            loaderTools.close()
        }
        Map<String, byte[]> contentsByName = new LinkedHashMap<>()
        int entries = 0
        long expandedBytes = 0
        ZipInputStream zip = new ZipInputStream(new ByteArrayInputStream(loaderArchiveBytes))
        try {
            ZipEntry entry
            while ((entry = zip.nextEntry) != null) {
                checkExpectedElapsed(startedAtNanos, limits)
                entries++
                if (entries > limits.maxArchiveEntries) {
                    failBoundary('Spring Boot loader reference entry budget exceeded')
                }
                if (entry.name == null || entry.name.isEmpty()
                        || entry.name.getBytes(StandardCharsets.UTF_8).length > limits.maxEntryNameBytes) {
                    failBoundary('Spring Boot loader reference entry name budget exceeded')
                }
                if (!entry.directory) {
                    byte[] contents = readBoundedBytes(
                            zip,
                            limits.maxExpandedEntryBytes,
                            expandedBytes,
                            limits.maxExpandedArchiveBytes,
                            startedAtNanos,
                            limits,
                            entry.name)
                    expandedBytes = checkedExpectedAdd(
                            expandedBytes,
                            contents.length,
                            limits.maxExpandedArchiveBytes,
                            'Spring Boot loader reference expanded byte budget exceeded')
                    if (!isEmittedLoaderEntry(entry.name)) {
                        continue
                    }
                    if (entry.name.endsWith('.class')
                            && (!entry.name.startsWith('org/springframework/boot/loader/')
                            || entry.name.toLowerCase(Locale.ROOT).contains('agent'))) {
                        failBoundary("unexpected Spring Boot loader reference class: ${entry.name}")
                    }
                    if (contentsByName.containsKey(entry.name)) {
                        failBoundary("duplicate Spring Boot loader reference entry: ${entry.name}")
                    }
                    contentsByName[entry.name] = contents
                }
            }
        } finally {
            zip.close()
        }
        if (contentsByName.isEmpty()) {
            failBoundary('Spring Boot loader reference contains no emitted entries')
        }
        contentsByName
    }

    static Map<String, WebhookEdgeExpectedEntry> expectedLoaderEntries(File loaderToolsJar) {
        expectedEntries(loaderReferenceContents(loaderToolsJar))
    }

    static Map<String, WebhookEdgeExpectedEntry> expectedEntries(Map<String, byte[]> contents) {
        Map<String, WebhookEdgeExpectedEntry> expected = new LinkedHashMap<>()
        contents.toSorted().each { name, bytes ->
            expected[name] = new WebhookEdgeExpectedEntry(bytes.length, sha256(bytes))
        }
        expected
    }

    private static void verifyExpectedOuterEntry(
            ZipFile archive,
            java.util.zip.ZipEntry entry,
            Map<String, WebhookEdgeExpectedEntry> expectedEntries,
            String label,
            ScanState state) {
        WebhookEdgeExpectedEntry expected = expectedEntries[entry.name]
        if (expected == null) {
            state.failBoundary("unexpected ${label} entry: ${entry.name}")
        }
        if (entry.size != expected.bytes) {
            state.failBoundary("${label} entry byte length mismatch: ${entry.name}")
        }
        MessageDigest digest = sha256Digest()
        long actualBytes = 0
        InputStream input = archive.getInputStream(entry)
        try {
            byte[] buffer = new byte[8_192]
            int count
            while ((count = input.read(buffer)) != -1) {
                state.checkElapsed()
                if (count < 0 || actualBytes > expected.bytes - count) {
                    state.failBoundary("${label} entry byte length mismatch: ${entry.name}")
                }
                actualBytes += count
                digest.update(buffer, 0, count)
            }
        } finally {
            input.close()
        }
        if (actualBytes != expected.bytes) {
            state.failBoundary("${label} entry byte length mismatch: ${entry.name}")
        }
        if (HexFormat.of().formatHex(digest.digest()) != expected.sha256) {
            state.failBoundary("${label} entry SHA-256 mismatch: ${entry.name}")
        }
    }

    private static void validateApplicationOutputPath(String packaged) {
        if (packaged.endsWith('.class')) {
            if (!packaged.startsWith(APPLICATION_PACKAGE_ROOT)) {
                failBoundary("unexpected application class output: ${packaged}")
            }
        } else if (packaged != APPLICATION_CONFIGURATION) {
            failBoundary("unexpected application resource output: ${packaged}")
        }
    }

    private static boolean isEmittedLoaderEntry(String name) {
        name.endsWith('.class') || name.startsWith('META-INF/services/')
    }

    private static WebhookEdgeExpectedEntry expectedEntry(
            Path path,
            long maximumBytes,
            long startedAtNanos,
            WebhookEdgeArchiveLimits limits) {
        long declaredBytes = Files.size(path)
        if (declaredBytes < 0 || declaredBytes > maximumBytes) {
            failBoundary("application output entry byte budget exceeded: ${path.fileName}")
        }
        MessageDigest digest = sha256Digest()
        long bytes = 0
        InputStream input = Files.newInputStream(path, LinkOption.NOFOLLOW_LINKS)
        try {
            byte[] buffer = new byte[8_192]
            int count
            while ((count = input.read(buffer)) != -1) {
                checkExpectedElapsed(startedAtNanos, limits)
                bytes = checkedExpectedAdd(
                        bytes,
                        count,
                        maximumBytes,
                        "application output entry byte budget exceeded: ${path.fileName}")
                digest.update(buffer, 0, count)
            }
        } finally {
            input.close()
        }
        if (bytes != declaredBytes) {
            failBoundary("application output byte length changed while reading: ${path.fileName}")
        }
        new WebhookEdgeExpectedEntry(bytes, HexFormat.of().formatHex(digest.digest()))
    }

    private static byte[] readBoundedBytes(
            InputStream input,
            long maximumEntryBytes,
            long aggregateBytes,
            long maximumAggregateBytes,
            long startedAtNanos,
            WebhookEdgeArchiveLimits limits,
            String entryName) {
        ByteArrayOutputStream output = new ByteArrayOutputStream()
        long bytes = 0
        byte[] buffer = new byte[8_192]
        int count
        while ((count = input.read(buffer)) != -1) {
            checkExpectedElapsed(startedAtNanos, limits)
            bytes = checkedExpectedAdd(
                    bytes,
                    count,
                    maximumEntryBytes,
                    "Spring Boot loader reference entry byte budget exceeded: ${entryName}")
            checkedExpectedAdd(
                    aggregateBytes,
                    bytes,
                    maximumAggregateBytes,
                    'Spring Boot loader reference expanded byte budget exceeded')
            output.write(buffer, 0, count)
        }
        output.toByteArray()
    }

    private static long checkedExpectedAdd(
            long current, long increment, long maximum, String message) {
        if (increment < 0 || current > maximum - increment) {
            failBoundary(message)
        }
        current + increment
    }

    private static void checkExpectedElapsed(
            long startedAtNanos, WebhookEdgeArchiveLimits limits) {
        long elapsed = System.nanoTime() - startedAtNanos
        if (elapsed < 0 || elapsed > limits.maxElapsedNanos) {
            failBoundary('expected archive entry elapsed time budget exceeded')
        }
    }

    private static String sha256(byte[] contents) {
        HexFormat.of().formatHex(sha256Digest().digest(contents))
    }

    private static MessageDigest sha256Digest() {
        MessageDigest.getInstance('SHA-256')
    }

    static void verifyRuntimeBoundary(List<String> runtimeArtifacts, Set<File> declaredFileDependencies) {
        List<String> rejectedArtifacts = runtimeArtifacts.findAll { value -> value.startsWith('REJECTED|') }
        if (!rejectedArtifacts.isEmpty()) {
            failBoundary("non-module runtime artifacts are forbidden: ${rejectedArtifacts}")
        }
        if (!declaredFileDependencies.isEmpty()) {
            List<String> descriptions = declaredFileDependencies.collect { file ->
                String kind = file.isDirectory() ? 'directory' : (file.isFile() ? 'file' : 'missing')
                "${kind}:${file.name}"
            }.sort()
            failBoundary("declared file dependencies are forbidden: ${descriptions}")
        }
        expectedTrustedObservabilityLibraries(runtimeArtifacts)
    }

    static Map<String, WebhookEdgeExpectedEntry> expectedTrustedObservabilityLibraries(
            List<String> runtimeArtifacts) {
        List<String> projects = runtimeArtifacts.findAll { value -> value.startsWith('PROJECT|') }
        if (projects.size() != 1) {
            failBoundary('trusted observability project artifact is not unique')
        }
        String[] fields = projects[0].split('\\|', -1)
        if (fields.length != 5
                || fields[1] != TRUSTED_OBSERVABILITY_PROJECT
                || !(fields[2] ==~ /observability-[A-Za-z0-9.+_-]+[.]jar/)
                || !(fields[3] ==~ /[1-9][0-9]*/)
                || !(fields[4] ==~ /[0-9a-f]{64}/)) {
            failBoundary('trusted observability project artifact is malformed')
        }
        [
            ("BOOT-INF/lib/${fields[2]}".toString()): new WebhookEdgeExpectedEntry(
                    Long.parseLong(fields[3]), fields[4])
        ]
    }

    private static void copyAndScanLibrary(
            ZipFile outer,
            java.util.zip.ZipEntry library,
            Map<String, WebhookEdgeExpectedEntry> trustedObservabilityLibraries,
            Set<String> trustedLibraries,
            ScanState state,
            WebhookEdgeArchiveLimits limits) {
        state.checkElapsed()
        if (library.size <= 0) {
            state.failBoundary("${library.name}: empty nested archive")
        }
        if (library.size > limits.maxLibraryBytes) {
            state.failBoundary("${library.name}: nested archive byte budget exceeded")
        }
        Path copy = state.nextScratchArchive()
        long copied = 0
        InputStream input = outer.getInputStream(library)
        OutputStream output = Files.newOutputStream(copy)
        try {
            byte[] buffer = new byte[8_192]
            int count
            while ((count = input.read(buffer)) != -1) {
                state.checkElapsed()
                copied = checkedAdd(state, copied, count, limits.maxLibraryBytes,
                        "${library.name}: nested archive byte budget exceeded")
                state.libraryBytes = checkedAdd(
                        state,
                        state.libraryBytes,
                        count,
                        limits.maxTotalLibraryBytes,
                        "${library.name}: aggregate nested archive byte budget exceeded")
                output.write(buffer, 0, count)
            }
        } finally {
            try {
                output.close()
            } finally {
                input.close()
            }
        }
        if (library.size >= 0 && copied != library.size) {
            state.failBoundary("${library.name}: nested archive size mismatch")
        }
        WebhookEdgeExpectedEntry trusted = trustedObservabilityLibraries[library.name]
        if (trusted != null) {
            if (copied != trusted.bytes
                    || sha256(Files.readAllBytes(copy)) != trusted.sha256) {
                state.failBoundary(
                        "${library.name}: trusted observability library SHA-256 mismatch")
            }
            trustedLibraries.add(library.name)
        }
        scanArchive(copy, library.name, 1, trusted != null, state, limits)
    }

    private static void scanArchive(
            Path archive,
            String displayName,
            int depth,
            boolean trustedObservability,
            ScanState state,
            WebhookEdgeArchiveLimits limits) {
        state.checkElapsed()
        if (depth > limits.maxDepth) {
            state.failBoundary("${displayName}: nested archive depth budget exceeded")
        }
        state.archives++
        if (state.archives > limits.maxArchives) {
            state.failBoundary("${displayName}: nested archive count budget exceeded")
        }
        ZipFile nested
        try {
            nested = new ZipFile(archive.toFile())
        } catch (IOException exception) {
            state.failBoundary("${displayName}: invalid or truncated ZIP archive")
            return
        }
        try {
            Set<String> names = new LinkedHashSet<>()
            int archiveEntries = 0
            int regularEntries = 0
            long archiveExpandedBytes = 0
            def entries = nested.entries()
            while (entries.hasMoreElements()) {
                state.checkElapsed()
                java.util.zip.ZipEntry entry = entries.nextElement()
                String name = entry.name
                validateEntryName(name, displayName, state, limits)
                if (!names.add(name)) {
                    state.failBoundary("${displayName}!/${name}: duplicate entry")
                }
                archiveEntries++
                state.nestedEntries++
                if (archiveEntries > limits.maxArchiveEntries) {
                    state.failBoundary("${displayName}!/${name}: per-archive entry budget exceeded")
                }
                if (state.nestedEntries > limits.maxTotalEntries) {
                    state.failBoundary("${displayName}!/${name}: aggregate entry budget exceeded")
                }
                if (entry.directory) {
                    continue
                }
                regularEntries++
                if (containsAny(name, FORBIDDEN_NESTED_PACKAGE_PATHS)
                        || (name.startsWith(ACCORD_PACKAGE_ROOT)
                        && !(trustedObservability
                        && name.startsWith(OBSERVABILITY_PACKAGE_ROOT)))) {
                    state.failBoundary("${displayName}!/${name}: forbidden nested class path")
                }
                EntryRead read = readEntry(nested, entry, displayName, state, limits)
                archiveExpandedBytes = checkedAdd(
                        state,
                        archiveExpandedBytes,
                        read.bytes,
                        limits.maxExpandedArchiveBytes,
                        "${displayName}!/${name}: per-archive expanded byte budget exceeded")
                if (read.archive != null) {
                    scanArchive(
                            read.archive,
                            "${displayName}!/${name}",
                            depth + 1,
                            false,
                            state,
                            limits)
                }
            }
            if (regularEntries == 0) {
                state.failBoundary("${displayName}: empty nested archive")
            }
        } catch (IOException exception) {
            state.failBoundary("${displayName}: corrupt nested archive payload")
        } finally {
            nested.close()
        }
    }

    private static EntryRead readEntry(
            ZipFile archive,
            java.util.zip.ZipEntry entry,
            String displayName,
            ScanState state,
            WebhookEdgeArchiveLimits limits) {
        state.checkElapsed()
        if (entry.size > limits.maxExpandedEntryBytes) {
            state.failBoundary("${displayName}!/${entry.name}: expanded entry byte budget exceeded")
        }
        InputStream input = archive.getInputStream(entry)
        OutputStream candidateOutput = null
        Path candidate = null
        long actual = 0
        byte[] prefix = new byte[4]
        int prefixSize = 0
        boolean detectionComplete = archiveName(entry.name)
        try {
            if (detectionComplete) {
                candidate = state.nextScratchArchive()
                candidateOutput = Files.newOutputStream(candidate)
            }
            byte[] buffer = new byte[8_192]
            int count
            while ((count = input.read(buffer)) != -1) {
                state.checkElapsed()
                actual = checkedAdd(
                        state,
                        actual,
                        count,
                        limits.maxExpandedEntryBytes,
                        "${displayName}!/${entry.name}: expanded entry byte budget exceeded")
                state.expandedBytes = checkedAdd(
                        state,
                        state.expandedBytes,
                        count,
                        limits.maxTotalExpandedBytes,
                        "${displayName}!/${entry.name}: aggregate expanded byte budget exceeded")
                int outputOffset = 0
                if (!detectionComplete) {
                    int prefixCount = Math.min(prefix.length - prefixSize, count)
                    System.arraycopy(buffer, 0, prefix, prefixSize, prefixCount)
                    prefixSize += prefixCount
                    outputOffset = prefixCount
                    if (prefixSize == prefix.length) {
                        detectionComplete = true
                        if (zipMagic(prefix, prefixSize)) {
                            candidate = state.nextScratchArchive()
                            candidateOutput = Files.newOutputStream(candidate)
                            candidateOutput.write(prefix)
                        }
                    }
                }
                if (candidateOutput != null && outputOffset < count) {
                    candidateOutput.write(buffer, outputOffset, count - outputOffset)
                }
            }
        } finally {
            try {
                if (candidateOutput != null) {
                    candidateOutput.close()
                }
            } finally {
                input.close()
            }
        }
        if (entry.size >= 0 && actual != entry.size) {
            state.failBoundary("${displayName}!/${entry.name}: expanded entry size mismatch")
        }
        new EntryRead(actual, candidate)
    }

    private static boolean archiveName(String name) {
        String lower = name.toLowerCase(Locale.ROOT)
        lower.endsWith('.jar') || lower.endsWith('.zip') || lower.endsWith('.war') || lower.endsWith('.ear')
    }

    private static boolean zipMagic(byte[] prefix, int size) {
        size == 4
                && prefix[0] == (byte) 'P'
                && prefix[1] == (byte) 'K'
                && ((prefix[2] == 3 && prefix[3] == 4)
                || (prefix[2] == 5 && prefix[3] == 6)
                || (prefix[2] == 7 && prefix[3] == 8))
    }

    private static void validateEntryName(
            String name,
            String displayName,
            ScanState state,
            WebhookEdgeArchiveLimits limits) {
        if (name == null || name.isEmpty()
                || name.getBytes(StandardCharsets.UTF_8).length > limits.maxEntryNameBytes) {
            state.failBoundary("${displayName}: entry name budget exceeded")
        }
        String normalized = name.endsWith('/') ? name.substring(0, name.length() - 1) : name
        if (normalized.isEmpty()
                || name.contains('\\')
                || name.startsWith('/')
                || name ==~ /^[A-Za-z]:.*/
                || normalized.split('/', -1).any { segment ->
                    segment.isEmpty() || segment == '.' || segment == '..'
                }) {
            state.failBoundary("${displayName}!/${name}: unsafe entry path")
        }
    }

    private static long checkedAdd(
            ScanState state, long current, long increment, long maximum, String message) {
        if (increment < 0 || current > maximum - increment) {
            state.failBoundary(message)
        }
        current + increment
    }

    private static String describeSetDifference(
            String label, Set<String> expected, Set<String> actual) {
        List<String> missing = (expected - actual).toList().sort().take(20)
        List<String> unexpected = (actual - expected).toList().sort().take(20)
        "${label} differ; missing=${missing}, unexpected=${unexpected}"
    }

    private static void failBoundary(String violation) {
        throw new GradleException("Webhook edge artifact boundary violated: ${violation}")
    }

    private static boolean containsAny(String value, List<String> fragments) {
        for (String fragment : fragments) {
            if (value.contains(fragment)) {
                return true
            }
        }
        false
    }

    private static final class ScanState {
        private final Path scratchDirectory
        private final WebhookEdgeArchiveLimits limits
        private final LongSupplier nanoTime
        private final long startedAtNanos
        private int nextArchive
        private int outerEntries
        private int archives
        private int nestedEntries
        private int violations
        private long libraryBytes
        private long expandedBytes

        private ScanState(
                Path scratchDirectory,
                WebhookEdgeArchiveLimits limits,
                LongSupplier nanoTime) {
            if (limits.maxViolations != 1) {
                throw new GradleException(
                        'Webhook edge artifact verifier violation budget must be exactly 1')
            }
            if (limits.maxElapsedNanos <= 0) {
                throw new GradleException(
                        'Webhook edge artifact verifier elapsed time budget must be positive')
            }
            this.scratchDirectory = scratchDirectory
            this.limits = limits
            this.nanoTime = Objects.requireNonNull(nanoTime, 'nanoTime')
            this.startedAtNanos = nanoTime.getAsLong()
        }

        private Path nextScratchArchive() {
            scratchDirectory.resolve(String.format(Locale.ROOT, 'nested-%05d.zip', nextArchive++))
        }

        private void checkElapsed() {
            long elapsed = nanoTime.getAsLong() - startedAtNanos
            if (elapsed < 0 || elapsed > limits.maxElapsedNanos) {
                failBoundary('elapsed time budget exceeded')
            }
        }

        private void failBoundary(String violation) {
            violations++
            if (violations != limits.maxViolations) {
                throw new GradleException(
                        'Webhook edge artifact boundary violation budget exceeded')
            }
            throw new GradleException("Webhook edge artifact boundary violated: ${violation}")
        }
    }

    private static final class EntryRead {
        private final long bytes
        private final Path archive

        private EntryRead(long bytes, Path archive) {
            this.bytes = bytes
            this.archive = archive
        }
    }
}

abstract class VerifyWebhookEdgeBoundary extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getArtifact()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getApplicationOutputDirectories()

    @Classpath
    abstract ConfigurableFileCollection getRuntimeClasspath()

    @Input
    abstract ListProperty<String> getRuntimeArtifacts()

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getLoaderToolsJar()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getDeclaredFileDependencies()

    @LocalState
    abstract DirectoryProperty getScratchDirectory()

    @TaskAction
    void verifyArtifact() {
        List<String> artifacts = runtimeArtifacts.get()
        WebhookEdgeArtifactVerifier.verifyRuntimeBoundary(
                artifacts, declaredFileDependencies.files)
        WebhookEdgeArtifactVerifier.verify(
                artifact.get().asFile,
                scratchDirectory.get().asFile,
                WebhookEdgeArtifactVerifier.expectedApplicationEntries(
                        applicationOutputDirectories.files),
                WebhookEdgeArtifactVerifier.expectedLoaderEntries(
                        loaderToolsJar.get().asFile),
                WebhookEdgeArtifactVerifier.expectedTrustedObservabilityLibraries(artifacts))
    }
}


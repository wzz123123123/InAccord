def temporalServiceClient = 'io.temporal:temporal-serviceclient:1.28.1'

def verifyGrpcGraph = { ResolvedComponentResult root ->
    def violations = []
    def pending = [[component: root, throughTemporal: false, path: [root.id.displayName]]]
    def visited = new HashSet<String>()
    while (!pending.empty) {
        def cursor = pending.remove(pending.size() - 1)
        def component = cursor.component as ResolvedComponentResult
        def stateKey = "${component.id.displayName}|${cursor.throughTemporal}"
        if (!visited.add(stateKey)) {
            continue
        }
        component.dependencies.findAll {
            it instanceof ResolvedDependencyResult
        }.each { edge ->
            def selected = (edge as ResolvedDependencyResult).selected
            def id = selected.id
            def coordinate = id instanceof ModuleComponentIdentifier
                ? "${id.group}:${id.module}:${id.version}"
                : id.displayName
            def throughTemporal = cursor.throughTemporal || coordinate == temporalServiceClient
            def path = cursor.path + coordinate
            if (id instanceof ModuleComponentIdentifier
                    && id.group == 'io.grpc'
                    && !throughTemporal) {
                violations.add(path.join(' -> '))
            }
            pending.add([
                component: selected,
                throughTemporal: throughTemporal,
                path: path
            ])
        }
    }
    violations.unique().sort()
}

tasks.register('verifyTemporalGrpcClosure') {
    group = 'verification'
    description = 'Requires every runtime gRPC path to pass through Temporal serviceclient 1.28.1.'
    inputs.files(configurations.runtimeClasspath)
        .withPropertyName('runtimeClasspath')
        .withNormalizer(ClasspathNormalizer)
    doLast {
        def graph = configurations.runtimeClasspath.incoming.resolutionResult.rootComponent.get()
        def violations = verifyGrpcGraph(graph)
        if (!violations.empty) {
            throw new GradleException(
                "Runtime gRPC dependencies bypass Temporal serviceclient: ${violations.join('; ')}")
        }
    }
}

tasks.register('verifyTemporalGrpcClosureHostileFixture') {
    group = 'verification'
    description = 'Proves the gRPC closure gate rejects a BOM-constrained direct dependency.'
    inputs.files(configurations.runtimeClasspath)
        .withPropertyName('runtimeClasspath')
        .withNormalizer(ClasspathNormalizer)
    doLast {
        def grpcVersion = '1.58.1'
        def grpcBom = "io.grpc:grpc-bom:${grpcVersion}"
        def grpcApi = "io.grpc:grpc-api:${grpcVersion}"
        def hostile = configurations.detachedConfiguration(
            dependencies.platform(grpcBom),
            dependencies.create('io.grpc:grpc-api'))
        def violations = verifyGrpcGraph(hostile.incoming.resolutionResult.rootComponent.get())
        if (!violations.any { it.contains("${grpcBom} -> ${grpcApi}") }) {
            throw new GradleException(
                'gRPC BOM constraint hostile fixture bypassed the closure gate')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyTemporalGrpcClosure')
    dependsOn tasks.named('verifyTemporalGrpcClosureHostileFixture')
}


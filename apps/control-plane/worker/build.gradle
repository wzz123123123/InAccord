import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedComponentResult
import org.gradle.api.artifacts.result.ResolvedDependencyResult

final class TemporalGrpcGraphVerifier {
    static List<String> violations(
            ResolvedComponentResult root,
            String temporalServiceClient) {
        def violations = []
        def pending = [[component: root, throughTemporal: false, path: [root.id.displayName]]]
        def visited = new HashSet<String>()
        while (!pending.empty) {
            def cursor = pending.remove(pending.size() - 1)
            def component = cursor.component as ResolvedComponentResult
            def stateKey = "${component.id.displayName}|${cursor.throughTemporal}"
            if (!visited.add(stateKey)) {
                continue
            }
            component.dependencies.findAll {
                it instanceof ResolvedDependencyResult
                    && !(it as ResolvedDependencyResult).constraint
            }.each { edge ->
                def selected = (edge as ResolvedDependencyResult).selected
                def id = selected.id
                def coordinate = id instanceof ModuleComponentIdentifier
                    ? "${id.group}:${id.module}:${id.version}"
                    : id.displayName
                def throughTemporal = cursor.throughTemporal || coordinate == temporalServiceClient
                def path = cursor.path + coordinate
                if (id instanceof ModuleComponentIdentifier
                        && id.group == 'io.grpc'
                        && id.module != 'grpc-bom'
                        && !throughTemporal) {
                    violations.add(path.join(' -> '))
                }
                pending.add([
                    component: selected,
                    throughTemporal: throughTemporal,
                    path: path
                ])
            }
        }
        violations.unique().sort()
    }
}


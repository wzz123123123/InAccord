tasks.register('workerProbeJar', Jar) {
    group = 'build'
    description = 'Builds the JDK-only, shell-free worker liveness/readiness probe.'
    dependsOn tasks.named('probeClasses')
    from sourceSets.probe.output
    archiveFileName = 'worker-probe.jar'
    destinationDirectory = layout.buildDirectory.dir('probe')
    manifest {
        attributes('Main-Class': 'com.inforvans.accord.controlplane.worker.probe.WorkerProbe')
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('workerProbeJar')
}

tasks.named('test', Test) { defaultTest ->
    dependsOn tasks.named('workerProbeJar')
    exclude { candidate ->
        defaultTest.filter.commandLineIncludePatterns.empty
            && candidate.file.name ==~ /.+IT(?:\$.*)?\.class/
    }
}

tasks.register('temporalMtlsTest', Test) {
    group = 'verification'
    description = 'Runs only the self-contained Temporal mTLS integration test.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter.includeTestsMatching(
        'com.inforvans.accord.controlplane.worker.temporal.TemporalMtlsIT')
    maxParallelForks = 1
    failFast = true
}

tasks.register('reconciliationCrashRecoveryTest', Test) {
    group = 'verification'
    description = 'Runs only the multi-process reconciliation crash recovery integration test.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter.includeTestsMatching(
        'com.inforvans.accord.controlplane.worker.temporal.ReconciliationCrashRecoveryIT')
    maxParallelForks = 1

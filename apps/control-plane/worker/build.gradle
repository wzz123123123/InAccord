def temporalServiceClient = 'io.temporal:temporal-serviceclient:1.28.1'
def runtimeClasspath = configurations.runtimeClasspath
def runtimeRootComponent = runtimeClasspath.incoming.resolutionResult.rootComponent
def hostileGrpcVersion = '1.58.1'
def hostileGrpcBom = "io.grpc:grpc-bom:${hostileGrpcVersion}"
def hostileGrpcApi = "io.grpc:grpc-api:${hostileGrpcVersion}"
def hostileGrpcClasspath = configurations.detachedConfiguration(
    dependencies.platform(hostileGrpcBom),
    dependencies.create('io.grpc:grpc-api'))
def hostileRootComponent = hostileGrpcClasspath.incoming.resolutionResult.rootComponent

tasks.register('verifyTemporalGrpcClosure') {
    group = 'verification'
    description = 'Requires every runtime gRPC path to pass through Temporal serviceclient 1.28.1.'
    inputs.files(runtimeClasspath)
        .withPropertyName('runtimeClasspath')
        .withNormalizer(ClasspathNormalizer)
    doLast {
        def violations = TemporalGrpcGraphVerifier.violations(
            runtimeRootComponent.get(), temporalServiceClient)
        if (!violations.empty) {
            throw new GradleException(
                "Runtime gRPC dependencies bypass Temporal serviceclient: ${violations.join('; ')}")
        }
    }
}

tasks.register('verifyTemporalGrpcClosureHostileFixture') {
    group = 'verification'
    description = 'Proves the gRPC closure gate rejects a BOM-constrained direct dependency.'
    inputs.files(hostileGrpcClasspath)
        .withPropertyName('hostileGrpcClasspath')
        .withNormalizer(ClasspathNormalizer)
    doLast {
        def root = hostileRootComponent.get()
        def violations = TemporalGrpcGraphVerifier.violations(root, temporalServiceClient)
        def directViolation = "${root.id.displayName} -> ${hostileGrpcApi}".toString()
        if (!violations.contains(directViolation)) {
            throw new GradleException(
                "gRPC BOM constraint hostile fixture bypassed the closure gate; observed: ${violations.join('; ')}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyTemporalGrpcClosure')
    dependsOn tasks.named('verifyTemporalGrpcClosureHostileFixture')
}

ext.controlPlaneBoundary = [
    expectedStartClass: 'com.inforvans.accord.ControlWorkerApplication',
    webRuntime: 'forbidden'

spring:
  application:
    name: accord-control-api
  modulith:
    detection-strategy: explicitly-annotated
  mvc:
    log-request-details: false
  datasource:
    url: ${ACCORD_DB_URL:jdbc:postgresql://localhost:5432/accord}
    username: ${ACCORD_API_DB_USER:accord_api_login}
    password: ${ACCORD_API_DB_PASSWORD:local-api-only}
    hikari:
      connection-init-sql: SET ROLE ${ACCORD_DB_SESSION_ROLE:accord_api}
  flyway:
    enabled: false
server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    baggage:
      enabled: false
    sampling:
      probability: ${ACCORD_TRACE_SAMPLE_RATE:0.1}
  metrics:
    tags:
      service: ${spring.application.name}
accord:
  process:
    role: control-api
    instance-id: ${ACCORD_PROCESS_INSTANCE_ID:${random.uuid}}
  http:
    api-contract-version: 0.1.0
    command-result-ttl: PT24H
  security:
    allowed-origin: ${ACCORD_BROWSER_ORIGIN:https://app.accord.example}
  telemetry:
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
    trust-certificate: ${OTEL_EXPORTER_OTLP_CERTIFICATE:}
    server-name: ${ACCORD_OTLP_SERVER_NAME:}
    environment: ${ACCORD_DEPLOYMENT_ENVIRONMENT:local}
    service-version: ${ACCORD_SERVICE_VERSION:0.1.0}
    queue-capacity: 2048
    batch-size: 256
    export-timeout: PT2S
    shutdown-timeout: PT5S
    sentinels: ${ACCORD_TELEMETRY_SENTINELS:}

otel:
  instrumentation:
    http:
      client:
        capture-request-headers: ""
        capture-response-headers: ""
      server:
        capture-request-headers: ""
        capture-response-headers: ""
    logback-appender:
      capture-mdc-attributes: ""
      capture-experimental-attributes: false
